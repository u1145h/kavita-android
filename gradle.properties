# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 uses built-in Kotlin and the new DSL by default.
# KSP
# Incremental KSP hits a "different roots" bug on Windows when the project and
# the Gradle dependency cache live on different drives (e.g. F: vs C:).
ksp.incremental=false
ksp.incremental.intermodule=false
